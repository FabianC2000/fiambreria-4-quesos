# Publica el sitio en GitHub Pages cada vez que algo cambia en main.
# El sitio es estático: no hay nada que compilar, se sube tal cual está.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos cambios seguidos, que no se pisen entre ellos.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true deja Pages configurado para publicar desde este
      # flujo de trabajo, sin tener que tocar el panel de Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: despliegue
        uses: actions/deploy-pages@v4
