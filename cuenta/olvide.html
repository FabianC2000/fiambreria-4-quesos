<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar la contraseña — Fiambrería 4 Quesos</title>
  <meta name="description" content="Pedí un enlace para elegir una contraseña nueva en Fiambrería 4 Quesos.">
  <meta name="theme-color" content="#1B1420">
  <!-- Nada que buscar acá, y menos que quede indexado. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/cuenta.css">
  <script>window.RAIZ = '../';</script>
  <!-- ==========================================================
       PANTALLA DE CARGA

       Aparece el logo mientras la página termina de armarse.

       El detalle que la hace útil en vez de molesta: NO se muestra
       enseguida. Arranca invisible y recién empieza a aparecer a
       los 400 ms. Si la página carga antes —que es lo normal en
       una computadora o con buena señal— el JS la saca y nadie la
       ve nunca. Se ve cuando de verdad hay una espera, que es con
       datos móviles flojos, y entonces en lugar de una pantalla en
       blanco se ve la marca.

       Dos seguros: si el JS fallara, la animación igual la
       esconde sola a los 3,5 s; y a quien pidió menos movimiento
       no se le muestra nunca.
       ========================================================== -->
  <style>
    #cargando{
      position:fixed;inset:0;z-index:9999;
      display:grid;place-items:center;background:#1B1420;
      opacity:0;visibility:hidden;
      animation:cargando-entra .3s ease-out .4s forwards,
                cargando-sale .4s ease-in 3.5s forwards;
    }
    #cargando img{width:min(190px,46vw);height:auto}
    #cargando.listo{animation:cargando-sale .3s ease-out forwards}
    @keyframes cargando-entra{to{opacity:1;visibility:visible}}
    @keyframes cargando-sale{to{opacity:0;visibility:hidden}}
    @media (prefers-reduced-motion:reduce){#cargando{display:none}}
  </style>
</head>

<body data-pagina="cuenta">
  <div id="cargando" aria-hidden="true"><img src="../assets/imagenes/logo/logo-dark.webp" alt=""></div>
  <script>
    /* Apenas el documento está armado, se va. El setTimeout dura
       lo que el desvanecido. */
    document.addEventListener('DOMContentLoaded', function () {
      var c = document.getElementById('cargando');
      if (!c) return;
      c.classList.add('listo');
      setTimeout(function () { c.remove(); }, 320);
    });
  </script>

  <div id="sitio-header"></div>

  <main class="cuenta-marco">
    <!-- El título y el texto los escribe cuenta.js: la misma
         pantalla sirve para pedir la contraseña nueva y para que
         reenviemos el correo de confirmación. -->
    <h1 id="titulo">Recuperar la contraseña</h1>
    <p class="entrada" id="entrada">Escribí tu correo y te mandamos un enlace para elegir una nueva.</p>

    <div id="nota" role="status" hidden></div>

    <form id="form-olvide" novalidate>
      <div class="campo">
        <label for="correo">Correo electrónico
          <span class="pista">El que usaste para crear la cuenta.</span></label>
        <input id="correo" name="correo" type="email" autocomplete="email" required maxlength="190">
        <span class="error" id="e-correo" hidden></span>
      </div>

      <button class="btn btn-ciruela" type="submit" id="btn-pedir">Mandarme el enlace</button>
    </form>

    <p class="pie-cuenta" id="otro-modo"></p>
    <p class="pie-cuenta"><a href="ingresar.html">Volver al ingreso</a></p>
  </main>

  <div id="sitio-footer"></div>

  <script src="../assets/js/productos.js"></script>
  <script src="../assets/js/metricas.js"></script>
  <script src="../assets/js/carrito.js"></script>
  <script src="../assets/js/usuarios.js"></script>
  <script src="../assets/js/header.js"></script>
  <script src="../assets/js/cuenta.js"></script>
  <script>FB.cuenta.olvido();</script>
</body>
</html>
